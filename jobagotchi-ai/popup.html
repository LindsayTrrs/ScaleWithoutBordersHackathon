<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobagotchi Dashboard</title>
  <style>
    :root {
      --purple-1: #4f46e5;
      --purple-2: #8b5cf6;
      --purple-soft: #e6e6ff;
      --cyan: #38bdf8;
      --green: #16c78a;
      --red: #ef4444;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f4f5f9;
      --card: #ffffff;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 420px;
      min-height: 568px;
      background: var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(17, 24, 39, 0.08);
    }

    .app-header {
      height: 66px;
      padding: 0 20px;
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }

    .brand-icon {
      font-size: 21px;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.15));
    }

    .level-pill {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    main::-webkit-scrollbar, .jobs-log-list::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb, .jobs-log-list::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 10px;
    }

    .pet-card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 16px;
      min-height: 158px;
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .pet-avatar-box {
      width: 86px;
      height: 86px;
      border-radius: 14px;
      background: linear-gradient(135deg, #dce4ff, #c9d0ff);
      border: 1px solid rgba(79, 70, 229, 0.16);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .pet-avatar-box img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      transform-origin: bottom center;
    }

    .pet-avatar-box.pet-petted img {
      animation: pet-wiggle 0.55s ease;
    }

    .pet-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pet-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .pet-name {
      height: 27px;
      min-width: 118px;
      max-width: 118px;
      padding: 4px 9px;
      border: 1px solid #cfd6e2;
      border-radius: 6px;
      background: #fff;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .rename-container {
      display: none;
      align-items: center;
      gap: 7px;
    }

    .rename-input {
      width: 118px;
      height: 27px;
      padding: 4px 9px;
      border: 1px solid #cfd6e2;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      outline: none;
    }

    .rename-confirm {
      height: 27px;
      min-width: 33px;
      border: 0;
      border-radius: 7px;
      background: var(--green);
      color: white;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
    }

    .bar-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bar-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .bar-track {
      height: 6px;
      background: #e6e9ef;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    #pet-xp-bar { background: #9ca3af; }
    #pet-energy-bar { background: var(--green); }

    .pet-btn {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      padding: 7px 13px;
      background: var(--purple-soft);
      color: #5b5ce2;
      font-size: 11px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 2px;
    }

    .pet-btn:hover { transform: translateY(-1px); }

    .stats-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .stat-card {
      height: 66px;
      background: var(--card);
      border-radius: 11px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--accent, var(--cyan));
    }

    .stat-card.fake { --accent: var(--red); }
    .stat-card.applied { --accent: var(--green); }

    .stat-val {
      font-size: 20px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: -0.3px;
    }

    .stat-lbl {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.25px;
    }

    .section-title {
      margin: 20px 0 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #5f6b7a;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .section-title-badge {
      min-width: 17px;
      height: 17px;
      border-radius: 999px;
      display: inline-grid;
      place-items: center;
      background: #e0e5eb;
      color: #7b8794;
      font-size: 10px;
      letter-spacing: 0;
    }

    .jobs-log-list {
      max-height: 230px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding-bottom: 16px;
    }

    .job-item {
      min-height: 72px;
      background: var(--card);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 13px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .job-title {
      margin: 0 0 3px;
      font-size: 12px;
      line-height: 1.15;
      font-weight: 950;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .job-company {
      margin: 0;
      font-size: 11px;
      line-height: 1.1;
      color: var(--muted);
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .job-meta-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
    }

    .score-badge {
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .score-badge.suspicious {
      background: #fee2e2;
      color: var(--red);
    }

    .score-badge.legit {
      background: #d1fae5;
      color: var(--green);
    }

    .score-badge.neutral {
      background: #fef3c7;
      color: #f59e0b;
    }

    .time-ago {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .job-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-btn, .status-tag {
      border: 0;
      border-radius: 7px;
      padding: 7px 10px;
      background: var(--purple-soft);
      color: #5b5ce2;
      font-size: 10px;
      font-weight: 950;
      white-space: nowrap;
      cursor: pointer;
    }

    .status-tag {
      cursor: default;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .status-tag.interviewing {
      background: #d1fae5;
      color: var(--green);
    }

    .job-btn-interview {
      background: #fef3c7;
      color: #d97706;
      padding: 5px 8px;
    }

    .empty-state {
      min-height: 150px;
      color: var(--muted);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      line-height: 1.45;
    }

    @keyframes pet-wiggle {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.12) rotate(-6deg); }
      75% { transform: scale(1.12) rotate(6deg); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon">🧹</span><span>Jobagotchi</span></div>
    <div id="pet-level-badge" class="level-pill">Lv.1 Intern Sweeper</div>
  </header>

  <main>
    <section class="pet-card">
      <div id="pet-avatar-container" class="pet-avatar-box">
        <img id="pet-avatar-img" src="icons/jobagotchi_sweeping.png" alt="Jobagotchi avatar" />
      </div>

      <div class="pet-info">
        <div class="pet-name-row">
          <span id="pet-name-display" class="pet-name">Sweepy-chan</span>
          <div id="rename-form" class="rename-container">
            <input id="rename-input" class="rename-input" maxlength="15" />
            <button id="rename-confirm-btn" class="rename-confirm">OK</button>
          </div>
        </div>

        <div class="bar-group">
          <div class="bar-label"><span>XP Progress</span><span id="pet-xp-text">0 / 100 XP</span></div>
          <div class="bar-track"><div id="pet-xp-bar" class="bar-fill" style="width:0%"></div></div>
        </div>

        <div class="bar-group">
          <div class="bar-label"><span>🔋 Energy</span><span id="pet-energy-text">70%</span></div>
          <div class="bar-track"><div id="pet-energy-bar" class="bar-fill" style="width:70%"></div></div>
        </div>

        <button id="pet-action-interact" class="pet-btn">❤️ Pet Sweepy-chan</button>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card scanned">
        <span id="stat-scanned" class="stat-val">0</span>
        <span class="stat-lbl">Scanned</span>
      </div>
      <div class="stat-card fake">
        <span id="stat-fakes" class="stat-val">0</span>
        <span class="stat-lbl">Fakes Swept</span>
      </div>
      <div class="stat-card applied">
        <span id="stat-applied" class="stat-val">0</span>
        <span class="stat-lbl">Applied</span>
      </div>
    </section>

    <div class="section-title">
      <span>Scanned Opportunities</span>
      <span id="scanned-jobs-count" class="section-title-badge">0</span>
    </div>

    <section id="jobs-log-container" class="jobs-log-list"></section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
